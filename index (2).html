<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инженерный дашборд дорожного строительства</title>
<style>
  /* ============================================================
     ТОКЕНЫ ТЕМ
     ============================================================ */
  :root{
    --bg:#080d15;
    --surface:#0f1826;
    --surface-2:#152132;
    --surface-3:#1b2a3e;
    --border:#22334c;
    --border-soft:#1a2739;
    --text:#e8eef8;
    --text-dim:#c3cfe0;
    --muted:#7e91ad;
    --grid-line:rgba(110,155,220,.065);

    --accent:#ffb020;
    --accent-2:#ff8a00;
    --accent-ink:#171004;
    --accent-glow:rgba(255,176,32,.24);

    --blue:#4ea3ff;
    --green:#3ddc97;
    --red:#ff6b6b;
    --violet:#a78bfa;

    --shadow-lg:0 18px 44px rgba(0,0,0,.50);
    --shadow-sm:0 6px 18px rgba(0,0,0,.30);
    --radius:16px;
    --radius-sm:11px;
  }

  [data-theme="light"]{
    --bg:#eaeff7;
    --surface:#ffffff;
    --surface-2:#f4f7fc;
    --surface-3:#e9eff8;
    --border:#d7e0ed;
    --border-soft:#e4ebf5;
    --text:#0d1725;
    --text-dim:#243449;
    --muted:#5c6f89;
    --grid-line:rgba(30,70,130,.055);

    --accent:#e08c00;
    --accent-2:#c47a00;
    --accent-ink:#ffffff;
    --accent-glow:rgba(224,140,0,.20);

    --blue:#1f6feb;
    --green:#0f9d58;
    --red:#d93838;
    --violet:#7c5cf0;

    --shadow-lg:0 16px 38px rgba(20,45,90,.11);
    --shadow-sm:0 4px 14px rgba(20,45,90,.07);
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0;
    min-height:100%;
    display:flex;
    flex-direction:column;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition:background-color .28s ease,color .28s ease;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--grid-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:54px 54px;
    background-position:-1px -1px;
    pointer-events:none;
    z-index:0;
  }

  header,nav,main,footer{position:relative;z-index:1}

  .wrap{
    width:100%;
    max-width:1440px;
    margin:0 auto;
    padding:0 26px;
  }

  .app-header{
    position:sticky;
    top:0;
    z-index:30;
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    background:rgba(8,13,21,.80);
  }
  [data-theme="light"] .app-header{
    background:rgba(255,255,255,.82);
  }

  .header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding-top:14px;
    padding-bottom:14px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:13px;
    min-width:0;
  }

  .brand-icon{
    width:46px;
    height:46px;
    flex:0 0 46px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    color:#1a1206;
    box-shadow:0 10px 24px var(--accent-glow);
  }

  .brand-text{
    display:flex;
    flex-direction:column;
    min-width:0;
    gap:1px;
  }

  .brand-text strong{
    font-size:17px;
    font-weight:750;
    letter-spacing:-.015em;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .brand-text small{
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:.025em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ============================================================
     ПАНЕЛЬ «ОБЪЕКТ» (НОВОЕ)
     ============================================================ */
  .object-bar{
    padding-top:14px;
  }

  .object-field{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 14px;
    box-shadow:var(--shadow-sm);
    transition:border-color .16s ease,box-shadow .16s ease,background-color .28s ease;
  }

  .object-field:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-glow);
  }

  .object-label{
    flex:0 0 auto;
    font-size:12.5px;
    font-weight:650;
    color:var(--text-dim);
    white-space:nowrap;
    letter-spacing:.01em;
  }

  .object-input{
    flex:1 1 auto;
    min-width:0;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
    background:transparent;
    border:none;
    outline:none;
    padding:2px 0;
    letter-spacing:-.005em;
  }

  .object-input::placeholder{
    color:var(--muted);
    font-weight:500;
    opacity:.85;
  }

  /* ============================================================
     КНОПКИ
     ============================================================ */
  .btn{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    line-height:1;
    padding:12px 18px;
    border-radius:var(--radius-sm);
    border:1px solid transparent;
    cursor:pointer;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .12s ease,background-color .18s ease,
               border-color .18s ease,color .18s ease,box-shadow .18s ease,filter .18s ease,opacity .18s ease;
    user-select:none;
  }
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn:disabled{opacity:.7;cursor:progress}

  .btn-primary{
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    color:var(--accent-ink);
    box-shadow:0 10px 24px var(--accent-glow);
  }
  .btn-primary:hover:not(:disabled){filter:brightness(1.08)}

  .btn-ghost{
    background:transparent;
    border-color:var(--border);
    color:var(--muted);
  }
  .btn-ghost:hover{
    color:var(--text);
    border-color:var(--muted);
    background:var(--surface-2);
  }

  .btn-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    line-height:1;
  }

  /* ============================================================
     ВКЛАДКИ
     ============================================================ */
  .tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding-top:22px;
    padding-bottom:4px;
  }

  .tab{
    font-family:inherit;
    font-size:13.5px;
    font-weight:650;
    letter-spacing:-.005em;
    padding:12px 20px;
    border-radius:999px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
    transition:all .18s ease;
    box-shadow:var(--shadow-sm);
  }
  .tab:hover{
    color:var(--text);
    border-color:var(--muted);
    transform:translateY(-1px);
  }
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tab.is-active{
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    color:var(--accent-ink);
    border-color:transparent;
    box-shadow:0 10px 26px var(--accent-glow);
  }

  main{
    flex:1;
    padding-bottom:52px;
  }

  .panel{display:none}
  .panel.is-active{display:block;animation:panelIn .26s ease both}

  @keyframes panelIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }

  .panel-head{padding:24px 0 20px}

  .panel-head h2{
    margin:0 0 7px;
    font-size:25px;
    font-weight:750;
    letter-spacing:-.025em;
    line-height:1.2;
  }

  .panel-head p{
    margin:0;
    color:var(--muted);
    font-size:13.5px;
    max-width:820px;
    line-height:1.6;
  }

  .panel-grid{
    display:grid;
    grid-template-columns:minmax(330px,1fr) minmax(400px,1.12fr);
    gap:20px;
    align-items:start;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-lg);
    padding:22px;
    transition:background-color .28s ease,border-color .28s ease;
  }

  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }

  .card-head h3{
    margin:0;
    font-size:11.5px;
    font-weight:750;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
  }

  .hint{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--muted);
    opacity:.72;
    text-transform:none;
  }

  .fields{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
    gap:15px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:7px;
    min-width:0;
  }

  .field-label{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    font-size:12.5px;
    font-weight:650;
    color:var(--text-dim);
    line-height:1.35;
  }

  .unit{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:750;
    letter-spacing:.02em;
    color:var(--accent);
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:2px 7px;
    border-radius:6px;
  }

  .field input{
    width:100%;
    padding:13px 14px;
    font-family:inherit;
    font-size:17px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--text);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    outline:none;
    transition:border-color .16s ease,box-shadow .16s ease,background-color .16s ease;
    -moz-appearance:textfield;
    appearance:textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .field input:hover{border-color:var(--muted)}
  .field input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-glow);
    background:var(--surface-3);
  }

  .field.invalid input{
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(255,107,107,.16);
  }

  .field.field-flash input{
    animation:fieldFlash 1.6s ease;
  }
  @keyframes fieldFlash{
    0%{
      border-color:var(--accent);
      box-shadow:0 0 0 0 var(--accent-glow);
      background:var(--surface-3);
    }
    25%{
      border-color:var(--accent);
      box-shadow:0 0 0 8px var(--accent-glow);
      background:var(--surface-3);
    }
    100%{
      border-color:var(--border);
      box-shadow:0 0 0 0 transparent;
    }
  }

  .field-error{
    font-size:11px;
    font-weight:650;
    color:var(--red);
    line-height:1.3;
    min-height:0;
  }
  .field-error:empty{display:none}

  .formula{
    margin-top:20px;
    padding:13px 15px;
    border-radius:var(--radius-sm);
    background:var(--surface-2);
    border:1px dashed var(--border);
    font-family:"Consolas","SFMono-Regular",Menlo,monospace;
    font-size:12.5px;
    font-weight:600;
    color:var(--text-dim);
    letter-spacing:.01em;
    line-height:1.7;
    overflow-x:auto;
    white-space:pre;
  }

  .actions{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:10.5px;
    font-weight:750;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:5px 12px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--muted);
    transition:color .2s ease,border-color .2s ease;
  }
  .status::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:currentColor;
    opacity:.85;
  }
  .status--ok{color:var(--green);border-color:var(--green)}
  .status--err{color:var(--red);border-color:var(--red)}

  .results{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
    gap:13px;
  }

  .result{
    --tone:var(--blue);
    position:relative;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:17px 18px 18px;
    border-radius:14px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-left:4px solid var(--tone);
    overflow:hidden;
    animation:resultIn .24s ease both;
  }

  @keyframes resultIn{
    from{opacity:0;transform:translateY(5px)}
    to{opacity:1;transform:translateY(0)}
  }

  .tone-blue{--tone:var(--blue)}
  .tone-green{--tone:var(--green)}
  .tone-amber{--tone:var(--accent)}
  .tone-red{--tone:var(--red)}
  .tone-violet{--tone:var(--violet)}

  .result-label{
    font-size:10.5px;
    font-weight:750;
    text-transform:uppercase;
    letter-spacing:.075em;
    color:var(--muted);
    line-height:1.35;
  }

  .result-num{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:2px;
    min-width:0;
  }

  .result-value{
    font-size:31px;
    font-weight:800;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
    line-height:1.08;
    color:var(--tone);
    word-break:break-word;
  }

  .result-value--text{
    font-size:18px;
    line-height:1.3;
    letter-spacing:-.01em;
  }

  .result-unit{
    font-size:12.5px;
    font-weight:750;
    color:var(--muted);
    margin-left:6px;
  }

  .bar{
    margin-top:9px;
    height:6px;
    border-radius:99px;
    background:var(--border);
    overflow:hidden;
  }

  .bar i{
    display:block;
    height:100%;
    border-radius:99px;
    background:var(--tone);
    transition:width .4s cubic-bezier(.22,1,.36,1);
  }

  .empty{
    grid-column:1/-1;
    padding:30px 22px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    border:1px dashed var(--border);
    border-radius:14px;
    background:var(--surface-2);
  }

  .transfer-zone{
    margin-top:20px;
    padding-top:20px;
    border-top:1px dashed var(--border);
  }

  .transfer-title{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 12px;
    font-size:10.5px;
    font-weight:750;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .transfer-title::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent-glow);
  }

  .btn-transfer{
    width:100%;
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 16px;
    background:linear-gradient(145deg,var(--surface-2),var(--surface-3));
    border:1px solid var(--border);
    border-radius:13px;
    cursor:pointer;
    font-family:inherit;
    color:var(--text);
    text-align:left;
    transition:all .2s ease;
    position:relative;
    overflow:hidden;
  }

  .btn-transfer::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
  }

  .btn-transfer > *{
    position:relative;
    z-index:1;
  }

  .btn-transfer:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
    box-shadow:0 10px 26px var(--accent-glow);
  }
  .btn-transfer:hover::before{opacity:.10}

  .btn-transfer:active{
    transform:translateY(0);
    box-shadow:0 4px 12px var(--accent-glow);
  }

  .btn-transfer:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .transfer-icon{
    flex:0 0 38px;
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    color:var(--accent-ink);
    box-shadow:0 6px 14px var(--accent-glow);
    transition:transform .2s ease;
  }

  .btn-transfer:hover .transfer-icon{
    transform:translateX(3px);
  }

  .transfer-text{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:3px;
  }

  .transfer-text strong{
    font-size:13.5px;
    font-weight:700;
    color:var(--text);
    letter-spacing:-.005em;
    line-height:1.25;
  }

  .transfer-text small{
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.02em;
    line-height:1.3;
  }

  .transfer-text [data-transfer-value]{
    color:var(--accent);
    font-weight:750;
    font-variant-numeric:tabular-nums;
  }

  .report-toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
    align-items:center;
  }

  .report-card{
    padding:26px 26px 22px;
  }

  .report-title-print{
    display:none;
    margin:0 0 6px;
    font-size:17px;
    font-weight:750;
    letter-spacing:-.01em;
    color:var(--text);
    text-align:center;
    line-height:1.3;
  }

  .report-title-print small{
    display:block;
    margin-top:4px;
    font-size:11px;
    font-weight:500;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .report-meta{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.01em;
    padding-bottom:14px;
    margin-bottom:18px;
    border-bottom:1px dashed var(--border);
    flex-wrap:wrap;
  }

  .report-meta::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent-glow);
    flex:0 0 7px;
  }

  .report-meta .report-meta-sep{
    color:var(--border);
    font-weight:400;
  }

  .report-meta .report-meta-object{
    color:var(--text);
    font-weight:700;
  }

  .report-body{
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  .report-table{
    width:100%;
    border-collapse:collapse;
    border-spacing:0;
    font-size:13.5px;
    background:var(--surface);
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--border);
  }

  .report-table th,
  .report-table td{
    padding:11px 15px;
    text-align:left;
    vertical-align:top;
    border-bottom:1px solid var(--border);
    line-height:1.45;
  }

  .report-table thead th{
    font-size:10.5px;
    font-weight:750;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
    background:var(--surface-2);
    border-bottom:2px solid var(--border);
    padding-top:12px;
    padding-bottom:12px;
  }

  .report-table .report-section td{
    background:linear-gradient(90deg,
      rgba(255,176,32,.13) 0%,
      rgba(255,176,32,.02) 100%);
    color:var(--accent);
    font-size:13.5px;
    font-weight:750;
    letter-spacing:-.005em;
    padding:13px 15px;
    border-bottom:1px solid var(--border);
  }

  [data-theme="light"] .report-table .report-section td{
    background:linear-gradient(90deg,
      rgba(224,140,0,.11) 0%,
      rgba(224,140,0,.02) 100%);
  }

  .report-table .report-subsection td{
    background:var(--surface-3);
    color:var(--muted);
    font-size:10.5px;
    font-weight:750;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:8px 15px;
  }

  .report-table .report-num{
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-weight:750;
    color:var(--text);
    white-space:nowrap;

<script>
(function () {
  "use strict";

  /* ============================================================
     >>> НАСТРОЙКА ОТПРАВКИ В GOOGLE SHEETS <<<
     URL веб-приложения Google Apps Script (Deploy → Web app).
     Доступ: «Все» (Anyone). Иначе браузер не сможет отправить POST.
     ============================================================ */
  var SHEET_URL = "https://script.google.com/macros/s/AKfycbw4ZqA2s9SQYlUDQPYOpJtdd9hxT5xmsK2aOSxO3onBVcyJv9wvHpzuXZ7fJRGiiTxPtg/exec";

  /* ============================================================
     КОНФИГУРАЦИЯ МОДУЛЕЙ
     ============================================================ */
  var MODULES = [

    {
      id: "fuel",
      tab: "Модуль 1: Расход топлива",
      title: "Расход топлива и стоимость работ",
      desc: "Расчёт количества топлива, потребного для выполнения заданного объёма " +
            "механизированных работ, стоимости его приобретения и удельных показателей. " +
            "Расстояние перевозки можно передать в Модуль 2 одним нажатием.",
      formula:
        "Q    = N · q · P / 1000\n" +
        "C    = Q · Cт\n" +
        "qчас = Q / N\n" +
        "Cкм  = C / L",
      inputs: [
        { key: "N",  label: "Отработано маш-ч",      unit: "маш-ч",    step: 0.5,  def: 120, gt: 0 },
        { key: "q",  label: "Удельный расход",       unit: "г/л.с.·ч", step: 1,    def: 165, gt: 0 },
        { key: "P",  label: "Мощность двигателя",    unit: "л.с.",     step: 1,    def: 130, gt: 0 },
        { key: "ct", label: "Цена топлива",          unit: "руб/л",    step: 0.5,  def: 68,  gt: 0 },
        { key: "L",  label: "Расстояние перевозки",  unit: "км",       step: 0.5,  def: 18,  gt: 0 }
      ],
      compute: function (v) {
        var Q      = (v.N * v.q * v.P) / 1000;
        var C      = Q * v.ct;
        var qHour  = v.N > 0 ? Q / v.N : 0;
        var cPerKm = v.L > 0 ? C / v.L : 0;

        return [
          { label: "Расход топлива",    value: Q,      unit: "л",       tone: "blue"   },
          { label: "Стоимость топлива", value: C,      unit: "руб",     tone: "amber"  },
          { label: "Часовой расход",    value: qHour,  unit: "л/маш-ч", tone: "green"  },
          { label: "Стоимость на 1 км", value: cPerKm, unit: "руб/км",  tone: "violet" }
        ];
      },
      transfer: {
        fromKey:     "L",
        fromLabel:   "Расстояние",
        fromUnit:    "км",
        toModule:    "logistics",
        toKey:       "L",
        targetLabel: "Плечо отвозки",
        buttonTitle: "Передать Расстояние (км) в Модуль 2"
      }
    },

    {
      id: "logistics",
      tab: "Модуль 2: Логистика рейса",
      title: "Логистика рейса автосамосвала",
      desc: "Расчёт продолжительности рейса, количества рейсов за смену и сменной " +
            "производительности транспортного средства. Маш-часы работы можно " +
            "передать в Модуль 3 одним нажатием.",
      formula:
        "tдв  = 2 · L / v · 60\n" +
        "tр   = tп + tдв + tразгр\n" +
        "n    = Tсм · 60 / tр\n" +
        "W    = n · V · k\n" +
        "Wмч  = W / M",
      inputs: [
        { key: "L",   label: "Плечо отвозки",       unit: "км",    step: 0.5,  def: 18,   gt: 0 },
        { key: "v",   label: "Средняя скорость",    unit: "км/ч",  step: 1,    def: 42,   gt: 0 },
        { key: "tp",  label: "Время погрузки",      unit: "мин",   step: 0.5,  def: 8,    gt: 0 },
        { key: "tr",  label: "Время разгрузки",     unit: "мин",   step: 0.5,  def: 5,    gt: 0 },
        { key: "tsm", label: "Смена",               unit: "ч",     step: 0.5,  def: 8.2,  gt: 0 },
        { key: "V",   label: "Объём кузова",        unit: "м³",    step: 0.5,  def: 12,   gt: 0 },
        { key: "k",   label: "Коэф. использования", unit: "—",     step: 0.01, def: 0.95, gt: 0, max: 1 },
        { key: "mh",  label: "Маш-часы работы",     unit: "маш-ч", step: 0.5,  def: 8,    gt: 0 }
      ],
      compute: function (v) {
        var tDrive     = v.v > 0 ? (2 * v.L / v.v) * 60 : 0;
        var tTrip      = v.tp + tDrive + v.tr;
        var trips      = tTrip > 0 ? (v.tsm * 60) / tTrip : 0;
        var tripsFull  = Math.floor(trips);
        var W          = trips * v.V * v.k;
        var run        = trips * 2 * v.L;
        var volPerTrip = v.V * v.k;
        var prodPerMh  = v.mh > 0 ? W / v.mh : 0;

        return [
          { label: "Время рейса",                value: tTrip,      unit: "мин",      tone: "blue"   },
          { label: "Время в движении",           value: tDrive,     unit: "мин",      tone: "violet" },
          { label: "Рейсов за смену",            value: tripsFull,  unit: "шт",       tone: "amber"  },
          { label: "Сменная производительность", value: W,          unit: "м³/смену", tone: "green",
            progress: Math.min(1, trips / 40) },
          { label: "Пробег за смену",            value: run,        unit: "км",       tone: "blue"   },
          { label: "Загрузка за рейс",           value: volPerTrip, unit: "м³",       tone: "green"  },
          { label: "Выработка на маш-ч",         value: prodPerMh,  unit: "м³/маш-ч", tone: "violet" }
        ];
      },
      transfer: {
        fromKey:     "mh",
        fromLabel:   "Маш-часы работы",
        fromUnit:    "маш-ч",
        toModule:    "earthwork",
        toKey:       "mh",
        targetLabel: "Маш-часы работы",
        buttonTitle: "Передать Маш-часы в Модуль 3"
      }
    },

    {
      id: "earthwork",
      tab: "Модуль 3: Объём земляных работ",
      title: "Объём насыпи земляного полотна",
      desc: "Расчёт площади поперечного сечения, объёма насыпи, ширины по подошве, " +
            "потребности в грунте с учётом уплотнения и выработки на машино-час.",
      formula:
        "S    = B · h + m · h²\n" +
        "V    = S · L\n" +
        "Bпод = B + 2 · m · h\n" +
        "Vгр  = V · kупл\n" +
        "Пмч  = Vгр / M",
      inputs: [
        { key: "B",    label: "Ширина поверху",       unit: "м",     step: 0.1,  def: 12,   gt: 0 },
        { key: "h",    label: "Высота насыпи",        unit: "м",     step: 0.1,  def: 2,    gt: 0 },
        { key: "m",    label: "Заложение откоса 1:m", unit: "—",     step: 0.1,  def: 1.5,  gt: 0 },
        { key: "L",    label: "Длина участка",        unit: "м",     step: 10,   def: 1000, gt: 0 },
        { key: "kupl", label: "Коэф. уплотнения",     unit: "—",     step: 0.01, def: 1.05, gt: 0 },
        { key: "mh",   label: "Маш-часы работы",      unit: "маш-ч", step: 0.5,  def: 8,    gt: 0 }
      ],
      compute: function (v) {
        var S         = v.B * v.h + v.m * v.h * v.h;
        var Vol       = S * v.L;
        var Bb        = v.B + 2 * v.m * v.h;
        var Vgr       = Vol * v.kupl;
        var area      = v.B * v.L;
        var prodPerMh = v.mh > 0 ? Vgr / v.mh : 0;
        var shifts    = v.mh / 8;

        return [
          { label: "Площадь сечения",           value: S,         unit: "м²",       tone: "blue"   },
          { label: "Объём насыпи",              value: Vol,       unit: "м³",       tone: "amber"  },
          { label: "Ширина по подошве",         value: Bb,        unit: "м",        tone: "violet" },
          { label: "Объём грунта (уплотн.)",    value: Vgr,       unit: "м³",       tone: "green"  },
          { label: "Площадь основной площадки", value: area,      unit: "м²",       tone: "blue"   },
          { label: "Выработка на маш-ч",        value: prodPerMh, unit: "м³/маш-ч", tone: "violet" },
          { label: "Машино-смен (по 8 ч)",      value: shifts,    unit: "см",       tone: "amber"  }
        ];
      }
    }
  ];

  var REPORT = {
    id: "report",
    tab: "Сводный отчёт",
    title: "Сводный отчёт по проекту",
    desc: "Итоговая таблица со всеми исходными данными и результатами расчётов " +
          "по трём модулям. Отчёт можно актуализировать, сохранить проект в браузере " +
          "или вывести на печать / экспортировать в PDF."
  };

  var ALL_TABS = MODULES.concat([REPORT]);

  /* ============================================================
     СОСТОЯНИЕ
     ============================================================ */
  var STORAGE_KEY = "road-engineering-dashboard-v3";

  var state = {
    theme:      "dark",
    active:     MODULES[0].id,
    values:     {},
    results:    {},
    objectName: ""
  };

  var panels      = {};
  var tabsEl      = document.getElementById("tabs");
  var appEl       = document.getElementById("app");
  var themeBtn    = document.getElementById("themeBtn");
  var themeIcon   = document.getElementById("themeIcon");
  var themeLabel  = document.getElementById("themeLabel");
  var toastBox    = document.getElementById("toastContainer");
  var objectInput = document.getElementById("objectName");

  MODULES.forEach(function (m) {
    state.values[m.id] = {};
    m.inputs.forEach(function (inp) {
      state.values[m.id][inp.key] = inp.def;
    });
    state.results[m.id] = null;
  });

  /* ============================================================
     УТИЛИТЫ
     ============================================================ */
  function formatNumber(n) {
    if (!isFinite(n)) return "—";
    var abs = Math.abs(n);
    var digits = 2;
    if (abs >= 10000)            digits = 0;
    else if (abs >= 1000)        digits = 1;
    else if (abs < 1 && abs > 0) digits = 3;

    return new Intl.NumberFormat("ru-RU", {
      minimumFractionDigits: 0,
      maximumFractionDigits: digits
    }).format(n);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function parseFieldValue(raw, rule) {
    var s = String(raw).trim().replace(",", ".");
    if (s === "") return { ok: false, msg: "Введите значение" };
    if (!/^-?\d*\.?\d+$/.test(s)) return { ok: false, msg: "Некорректное число" };

    var num = Number(s);
    if (!isFinite(num)) return { ok: false, msg: "Некорректное число" };
    if (num < 0) return { ok: false, msg: "Отрицательное значение недопустимо" };
    if (rule && typeof rule.gt === "number" && !(num > rule.gt)) {
      return { ok: false, msg: "Должно быть больше " + rule.gt };
    }
    if (rule && typeof rule.max === "number" && num > rule.max) {
      return { ok: false, msg: "Не более " + rule.max };
    }
    return { ok: true, value: num };
  }

  function findModule(id) {
    for (var i = 0; i < MODULES.length; i++) {
      if (MODULES[i].id === id) return MODULES[i];
    }
    return null;
  }

  function findInput(module, key) {
    for (var i = 0; i < module.inputs.length; i++) {
      if (module.inputs[i].key === key) return module.inputs[i];
    }
    return null;
  }

  /* ============================================================
     СОХРАНЕНИЕ / ЗАГРУЗКА
     ============================================================ */
  function saveState(isManual) {
    try {
      var prev = null;
      try { prev = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
      catch (e) { prev = null; }

      var payload = {
        theme:      state.theme,
        active:     state.active,
        values:     state.values,
        objectName: state.objectName,
        manualSave: isManual
          ? new Date().toISOString()
          : (prev && prev.manualSave) || null
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (e) { /* приватный режим */ }
  }

  function loadState() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
    catch (e) { saved = null; }

    if (!saved || typeof saved !== "object") return;

    if (saved.theme === "dark" || saved.theme === "light") state.theme = saved.theme;
    if (typeof saved.objectName === "string") state.objectName = saved.objectName;

    if (saved.active) {
      var valid = saved.active === REPORT.id || !!findModule(saved.active);
      if (valid) state.active = saved.active;
    }

    if (saved.values && typeof saved.values === "object") {
      MODULES.forEach(function (m) {
        var src = saved.values[m.id];
        if (!src || typeof src !== "object") return;
        m.inputs.forEach(function (inp) {
          var val = src[inp.key];
          if (typeof val === "number" && isFinite(val) && val >= 0) {
            state.values[m.id][inp.key] = val;
          }
        });
      });
    }
  }

      '<div class="panel-grid">' +

            '<h3>Исходные данные</h3>' +
            '<span class="hint">только неотрицательные значения</span>' +
          '</div>' +
          '<div class="fields"></div>' +
          '<div class="formula"></div>' +
          '<div class="actions">' +
            '<button class="btn btn-primary" type="button" data-act="calc">Рассчитать</button>' +

    panel.querySelector(".formula").textContent       = m.formula;

    var fieldsEl = panel.querySelector(".fields");

    m.inputs.forEach(function (inp) {
      var field = document.createElement("label");
      field.className = "field";

      var labelRow = document.createElement("span");
      labelRow.className = "field-label";

      var labelText = document.createElement("span");
      labelText.textContent = inp.label;

      var unitEl = document.createElement("span");
      unitEl.className = "unit";
      unitEl.textContent = inp.unit;

      labelRow.appendChild(labelText);
      labelRow.appendChild(unitEl);

      var input = document.createElement("input");
      input.type = "number";
      input.inputMode = "decimal";
      input.min = "0";
      input.step = String(inp.step);
      input.value = String(state.values[m.id][inp.key]);
      input.dataset.key = inp.key;
      input.setAttribute("aria-label", inp.label + ", " + inp.unit);
      input.autocomplete = "off";

      input.addEventListener("keydown", function (e) {
        if (e.key === "-" || e.key === "+" || e.key === "e" || e.key === "E") {
          e.preventDefault();
        }
      });

      input.addEventListener("paste", function (e) {
        var text = (e.clipboardData || window.clipboardData).getData("text");
        if (text && /-/.test(text)) e.preventDefault();
      });

      input.addEventListener("input", function () { update(m, false); });
      input.addEventListener("blur",  function () { update(m, false); });

      var errEl = document.createElement("span");
      errEl.className = "field-error";

      field.appendChild(labelRow);
      field.appendChild(input);
      field.appendChild(errEl);

      fieldsEl.appendChild(field);
    });

    /* Кнопка «Рассчитать» — расчёт + отправка в Google Sheets */
    panel.querySelector('[data-act="calc"]').addEventListener("click", function () {
      var ok = update(m, true);
      if (ok && state.results[m.id]) {
        sendModuleToSheet(m);
      }
    });

    panel.querySelector('[data-act="reset"]').addEventListener("click", function () {
      resetModule(m);
    });

    if (m.transfer) buildTransferZone(m, panel);

    appEl.appendChild(panel);
    panels[m.id] = panel;
  }

  /* ============================================================
     СВОДНЫЙ ОТЧЁТ
     ============================================================ */
  function renderReport() {
    var panel = panels[REPORT.id];
    if (!panel) return;

    var metaEl = panel.querySelector("[data-report-meta]");
    var bodyEl = panel.querySelector("[data-report-body]");
    if (!metaEl || !bodyEl) return;

    var now = new Date();
    var dateStr = now.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
    var timeStr = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    var objName = (state.objectName || "").trim();

    metaEl.innerHTML = "";
    if (objName) {
      var objSpan = document.createElement("span");
      objSpan.className = "report-meta-object";
      objSpan.textContent = objName;
      metaEl.appendChild(objSpan);

      var sep = document.createElement("span");
      sep.className = "report-meta-sep";
      sep.textContent = "·";
      metaEl.appendChild(sep);
    }
    var dateSpan = document.createElement("span");
    dateSpan.textContent = "Дата формирования отчёта: " + dateStr + " " + timeStr;
    metaEl.appendChild(dateSpan);

    var html = "";

    MODULES.forEach(function (m, idx) {
      var moduleNum = idx + 1;
      html += '<table class="report-table">';
      html += '<thead>';
      html += '<tr class="report-section"><td colspan="4">' +
              'Модуль ' + moduleNum + '. ' + escapeHtml(m.title) +
              '</td></tr>';
      html += '<tr>' +
              '<th>Показатель</th>' +
              '<th>Обозн.</th>' +
              '<th class="report-num-col">Значение</th>' +
              '<th>Ед. изм.</th>' +
              '</tr>';
      html += '</thead>';
      html += '<tbody>';
      html += '<tr class="report-subsection"><td colspan="4">Исходные данные</td></tr>';

      m.inputs.forEach(function (inp) {
        var val = state.values[m.id] ? state.values[m.id][inp.key] : undefined;
        var valStr = (typeof val === "number" && isFinite(val)) ? formatNumber(val) : "—";
        html += '<tr>' +
                '<td>' + escapeHtml(inp.label) + '</td>' +
                '<td class="report-code">' + escapeHtml(inp.key) + '</td>' +
                '<td class="report-num">' + valStr + '</td>' +
                '<td class="report-unit">' + escapeHtml(inp.unit) + '</td>' +
                '</tr>';
      });

      html += '<tr class="report-subsection"><td colspan="4">Результаты расчёта</td></tr>';

      var results = state.results[m.id];
      if (results && results.length) {
        results.forEach(function (r) {
          var valStr = (typeof r.value === "number" && isFinite(r.value))
            ? formatNumber(r.value)
            : escapeHtml(r.value);
          html += '<tr>' +
                  '<td>' + escapeHtml(r.label) + '</td>' +
                  '<td class="report-code">—</td>' +
                  '<td class="report-num">' + valStr + '</td>' +
                  '<td class="report-unit">' + escapeHtml(r.unit || "") + '</td>' +
                  '</tr>';
        });
      } else {
        html += '<tr><td colspan="4" class="report-empty">' +
                'Нет данных — проверьте исходные данные модуля' +
                '</td></tr>';
      }

      html += '</tbody></table>';
    });

    bodyEl.innerHTML = html;
  }

  /* ============================================================
     ЗОНА ПЕРЕДАЧИ
     ============================================================ */
  function buildTransferZone(m, panel) {
    var zone = panel.querySelector("[data-transfer-zone]");
    zone.hidden = false;

    var title = document.createElement("p");
    title.className = "transfer-title";
    title.textContent = "Межмодульный обмен данными";

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn-transfer";
    btn.setAttribute("aria-label", m.transfer.buttonTitle);

    btn.innerHTML =
      '<span class="transfer-icon" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" ' +
             'stroke="currentColor" stroke-width="2.4" ' +
             'stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M5 12h13"/>' +
          '<path d="m12 5 7 7-7 7"/>' +
        '</svg>' +
      '</span>' +
      '<span class="transfer-text">' +
        '<strong></strong>' +
        '<small>Текущее значение: <span data-transfer-value>—</span></small>' +
      '</span>';

    btn.querySelector("strong").textContent = m.transfer.buttonTitle;
    btn.addEventListener("click", function () { doTransfer(m); });

    zone.appendChild(title);
    zone.appendChild(btn);
  }

  function updateTransferButton(m) {
    if (!m.transfer) return;
    var panel = panels[m.id];
    if (!panel) return;
    var btn = panel.querySelector(".btn-transfer");
    if (!btn) return;
    var valEl = btn.querySelector("[data-transfer-value]");
    if (!valEl) return;

    var input = panel.querySelector('input[data-key="' + m.transfer.fromKey + '"]');
    if (!input) { valEl.textContent = "—"; return; }

    var rule = findInput(m, m.transfer.fromKey);
    var res  = parseFieldValue(input.value, rule);
    valEl.textContent = res.ok
      ? formatNumber(res.value) + " " + m.transfer.fromUnit
      : "—";
  }

  function doTransfer(sourceModule) {
    var tr = sourceModule.transfer;
    if (!tr) return;

    var srcPanel = panels[sourceModule.id];
    if (!srcPanel) return;

    var srcInput = srcPanel.querySelector('input[data-key="' + tr.fromKey + '"]');
    if (!srcInput) return;

    var srcField = srcInput.closest(".field");
    var srcErrEl = srcField.querySelector(".field-error");
    var srcRule  = findInput(sourceModule, tr.fromKey);
    var srcRes   = parseFieldValue(srcInput.value, srcRule);

    if (!srcRes.ok) {
      srcField.classList.add("invalid");
      srcErrEl.textContent = srcRes.msg || "Некорректное значение";
      try { srcInput.focus({ preventScroll: false }); } catch (e) { srcInput.focus(); }
      showToast("Нельзя передать: " + (srcRes.msg || "проверьте значение"), "error");
      return;
    }

    srcField.classList.remove("invalid");
    srcErrEl.textContent = "";

    var targetModule = findModule(tr.toModule);
    if (!targetModule) { showToast("Целевой модуль не найден", "error"); return; }

    var tgtRule = findInput(targetModule, tr.toKey);
    if (!tgtRule) { showToast("Целевое поле не найдено", "error"); return; }

    var tgtCheck = parseFieldValue(String(srcRes.value), tgtRule);
    if (!tgtCheck.ok) {
      showToast("Значение не подходит для поля «" + tgtRule.label + "»: " +
                (tgtCheck.msg || "ошибка"), "error");
      return;
    }

    var tgtPanel = panels[tr.toModule];
    var tgtInput = tgtPanel.querySelector('input[data-key="' + tr.toKey + '"]');
    if (!tgtInput) { showToast("Целевое поле не найдено", "error"); return; }

    var tgtField = tgtInput.closest(".field");
    var tgtErrEl = tgtField.querySelector(".field-error");

    tgtInput.value = String(srcRes.value);
    tgtField.classList.remove("invalid");
    tgtErrEl.textContent = "";
    state.values[tr.toModule][tr.toKey] = srcRes.value;

    update(targetModule, false);
    activate(tr.toModule);

    tgtField.classList.remove("field-flash");
    void tgtField.offsetWidth;
    tgtField.classList.add("field-flash");
    window.setTimeout(function () { tgtField.classList.remove("field-flash"); }, 1700);

    window.setTimeout(function () {
      try { tgtInput.focus({ preventScroll: true }); } catch (e) { tgtInput.focus(); }
      try { tgtField.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
    }, 90);

    showToast("Передано в «" + targetModule.title + "»: " +
              tr.fromLabel + " = " + formatNumber(srcRes.value) + " " + tr.fromUnit,
              "success");
    saveState(false);
  }

  /* ============================================================
     ТОСТЫ
     ============================================================ */
  function showToast(message, kind) {
    if (!toastBox) return;

    var toast = document.createElement("div");
    toast.className = "toast toast--" + (kind === "error" ? "error" : "success");
    toast.setAttribute("role", "status");

    var mark = document.createElement("span");
    mark.className = "toast__mark";
    mark.setAttribute("aria-hidden", "true");

    var text = document.createElement("span");
    text.textContent = message;

    toast.appendChild(mark);
    toast.appendChild(text);
    toastBox.appendChild(toast);

    requestAnimationFrame(function () {
      requestAnimationFrame(function () { toast.classList.add("is-in"); });
    });

    window.setTimeout(function () {
      toast.classList.remove("is-in");
      window.setTimeout(function () {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 320);
    }, 2600);

    while (toastBox.children.length > 3) {
      toastBox.removeChild(toastBox.firstChild);
    }
  }

  /* ============================================================
     ВАЛИДАЦИЯ И РАСЧЁТ
     ============================================================ */
  function readInputs(m) {
    var panel = panels[m.id];
    var values = {};
    var allValid = true;

    m.inputs.forEach(function (inp) {
      var input = panel.querySelector('input[data-key="' + inp.key + '"]');
      var field = input.closest(".field");
      var errEl = field.querySelector(".field-error");
      var res   = parseFieldValue(input.value, inp);

      if (res.ok) {
        field.classList.remove("invalid");
        errEl.textContent = "";
        values[inp.key] = res.value;
      } else {
        field.classList.add("invalid");
        errEl.textContent = res.msg;
        allValid = false;
      }
    });

    return allValid ? values : null;
  }

  function setStatus(m, kind) {
    var el = panels[m.id].querySelector("[data-status]");
    el.classList.remove("status--ok", "status--err");
    if (kind === "ok") {
      el.classList.add("status--ok");
      el.textContent = "Рассчитано";
    } else if (kind === "err") {
      el.classList.add("status--err");
      el.textContent = "Проверьте ввод";
    } else {
      el.textContent = "Ожидание";
    }
  }

  /* Возвращает true при успешном расчёте */
  function update(m, forceRender) {
    var values = readInputs(m);
    updateTransferButton(m);

    if (!values) {
      setStatus(m, "err");
      if (forceRender) renderResults(m);
      return false;
    }

    state.values[m.id] = values;

    try {
      state.results[m.id] = m.compute(values);
      setStatus(m, "ok");
    } catch (err) {
      state.results[m.id] = null;
      setStatus(m, "err");
      renderResults(m);
      return false;
    }

    renderResults(m);
    saveState(false);
    return true;
  }

  function renderResults(m) {
    var box = panels[m.id].querySelector("[data-results]");
    var cards = state.results[m.id];
    box.innerHTML = "";

    if (!cards || !cards.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Нет данных для отображения — проверьте исходные данные";
      box.appendChild(empty);
      return;
    }

    cards.forEach(function (card, index) {
      var item = document.createElement("div");
      item.className = "result tone-" + (card.tone || "blue");
      item.style.animationDelay = (index * 0.035) + "s";

      var label = document.createElement("span");
      label.className = "result-label";
      label.textContent = card.label;

      var num = document.createElement("span");
      num.className = "result-num";

      var valueEl = document.createElement("span");

      if (typeof card.value === "number" && isFinite(card.value)) {
        valueEl.className = "result-value";
        valueEl.textContent = formatNumber(card.value);
        num.appendChild(valueEl);
        if (card.unit) {
          var unitEl = document.createElement("span");
          unitEl.className = "result-unit";
          unitEl.textContent = card.unit;
          num.appendChild(unitEl);
        }
      } else {
        valueEl.className = "result-value result-value--text";
        valueEl.textContent = String(card.value);
        num.appendChild(valueEl);
      }

      item.appendChild(label);
      item.appendChild(num);

      if (typeof card.progress === "number" && isFinite(card.progress)) {
        var p = Math.max(0, Math.min(1, card.progress));
        var bar = document.createElement("div");
        bar.className = "bar";
        var fill = document.createElement("i");
        fill.style.width = (p * 100).toFixed(2) + "%";
        bar.appendChild(fill);
        item.appendChild(bar);
      }

      box.appendChild(item);
    });
  }

  function resetModule(m) {
    var panel = panels[m.id];
    m.inputs.forEach(function (inp) {
      var input = panel.querySelector('input[data-key="' + inp.key + '"]');
      input.value = String(inp.def);
      var field = input.closest(".field");
      var errEl = field.querySelector(".field-error");
      field.classList.remove("invalid");
      errEl.textContent = "";
    });
    update(m, true);
  }

  /* ============================================================
     ОТПРАВКА В GOOGLE SHEETS
     ============================================================ */

  /* Формирует payload для одного модуля */
  function buildModulePayload(m) {
    var results = state.results[m.id];
    if (!results) return null;

    var vals = state.values[m.id];
    var objName = (state.objectName || "").trim() || "Объект не указан";

    var inputData = m.inputs.map(function (inp) {
      var v = vals[inp.key];
      return inp.label + "=" + (v !== undefined ? v : "?") + " " + inp.unit;
    }).join("; ");

    var resultsData = results.map(function (r) {
      var v = (typeof r.value === "number" && isFinite(r.value))
        ? formatNumber(r.value)
        : r.value;
      return r.label + "=" + v + (r.unit ? " " + r.unit : "");
    }).join("; ");

    return {
      objectName:  objName,
      module:      m.tab,
      moduleId:    m.id,
      moduleTitle: m.title,
      inputData:   inputData,
      resultsData: resultsData,
      inputs:      vals,
      results:     results,
      timestamp:   new Date().toISOString(),
      page:        (typeof location !== "undefined") ? location.href : ""
    };
  }

  /* Универсальная отправка POST → no-cors */
  function postToSheet(payload, onSuccess, onError) {
    if (!SHEET_URL || SHEET_URL.indexOf("ВАШ_SCRIPT_URL") !== -1) {
      console.warn("[Dashboard] SHEET_URL не настроен — отправка пропущена");
      if (onError) onError(new Error("URL не настроен"));
      return;
    }

    fetch(SHEET_URL, {
      method:  "POST",
      mode:    "no-cors",   /* обязательно для Google Apps Script */
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify(payload)
    })
    .then(function () {
      /* no-cors → ответ opaque, судим только по факту завершения запроса */
      if (onSuccess) onSuccess();
    })
    .catch(function (err) {
      console.error("[Dashboard] Ошибка отправки:", err);
      if (onError) onError(err);
    });
  }

  /* Отправка одного модуля (по кнопке «Рассчитать») */
  function sendModuleToSheet(m) {
    var payload = buildModulePayload(m);
    if (!payload) return;

    var btn = panels[m.id].querySelector('[data-act="calc"]');
    var origText = btn ? btn.textContent : "";

    if (btn) {
      btn.disabled = true;
      btn.textContent = "Отправка…";
    }

    postToSheet(payload, function () {
      showToast("Данные «" + m.tab + "» отправлены", "success");
      if (btn) btn.textContent = "✓ Отправлено";
      window.setTimeout(function () {
        if (btn) { btn.disabled = false; btn.textContent = origText; }
      }, 1400);
    }, function () {
      showToast("Не удалось отправить данные в таблицу", "error");
      if (btn) { btn.disabled = false; btn.textContent = origText; }
    });
  }

  /* Отправка всех модулей одним пакетом (из отчёта) */
  function sendAllToSheet() {
    var missing = [];
    MODULES.forEach(function (m) {
      if (!state.results[m.id]) missing.push(m.tab);
    });
    if (missing.length) {
      showToast("Сначала рассчитайте: " + missing.join(", "), "error");
      return;
    }

    var objName = (state.objectName || "").trim() || "Объект не указан";

    var payload = {
      objectName: objName,
      module:     "Все модули (сводный пакет)",
      moduleId:   "all",
      moduleTitle: "Сводный отчёт",
      timestamp:  new Date().toISOString(),
      page:       (typeof location !== "undefined") ? location.href : "",
      modules:    MODULES.map(function (m) {
        return {
          id:         m.id,
          tab:        m.tab,
          title:      m.title,
          inputs:     state.values[m.id],
          results:    state.results[m.id]
        };
      }),
      /* дублируем в текстовом виде — удобно для таблицы */
      inputData:   MODULES.map(function (m) {
        return m.tab + ": " + m.inputs.map(function (inp) {
          return inp.label + "=" + state.values[m.id][inp.key] + " " + inp.unit;
        }).join(", ");
      }).join(" | "),
      resultsData: MODULES.map(function (m) {
        return m.tab + ": " + (state.results[m.id] || []).map(function (r) {
          return r.label + "=" + (typeof r.value === "number" ? formatNumber(r.value) : r.value) +
                 (r.unit ? " " + r.unit : "");
        }).join(", ");
      }).join(" | ")
    };

    var btn = panels[REPORT.id].querySelector('[data-act="send-all"]');
    var origHtml = btn ? btn.innerHTML : "";
    if (btn) { btn.disabled = true; }

    postToSheet(payload, function () {
      showToast("Все данные отправлены в таблицу", "success");
      if (btn) {
        window.setTimeout(function () {
          btn.disabled = false;
          btn.innerHTML = origHtml;
        }, 1400);
      }
    }, function () {
      showToast("Не удалось отправить пакет в таблицу", "error");
      if (btn) { btn.disabled = false; btn.innerHTML = origHtml; }
    });
  }

  /* ============================================================
     ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
     ============================================================ */
  function activate(id) {
    state.active = id;
    Object.keys(panels).forEach(function (pid) {
      var panel = panels[pid];
      if (!panel) return;
      panel.classList.toggle("is-active", pid === id);
    });
    Array.prototype.forEach.call(tabsEl.children, function (btn) {
      var on = btn.dataset.tab === id;
      btn.classList.toggle("is-active", on);
      btn.setAttribute("aria-selected", on ? "true" : "false");
      btn.setAttribute("tabindex", on ? "0" : "-1");
    });
    if (id === REPORT.id) renderReport();
    saveState(false);
  }

  /* ============================================================
     ТЕМА
     ============================================================ */
  function setTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    if (theme === "dark") {
      themeIcon.textContent  = "☀️";
      themeLabel.textContent = "Светлая тема";
      themeBtn.setAttribute("aria-label", "Включить светлую тему");
    } else {
      themeIcon.textContent  = "🌙";
      themeLabel.textContent = "Тёмная тема";
      themeBtn.setAttribute("aria-label", "Включить тёмную тему");
    }
    saveState(false);
  }

  themeBtn.addEventListener("click", function () {
    setTheme(state.theme === "dark" ? "light" : "dark");
  });

  /* ============================================================
     ИНИЦИАЛИЗАЦИЯ
     ============================================================ */
  function init() {
    loadState();

    /* Поле «Объект» */
    if (objectInput) {
      objectInput.value = state.objectName || "";
      objectInput.addEventListener("input", function () {
        state.objectName = objectInput.value;
        saveState(false);
        /* если открыт отчёт — обновим шапку */
        if (state.active === REPORT.id) renderReport();
      });
    }

    buildTabs();
    MODULES.forEach(function (m) { buildPanel(m); });
    buildReportPanel();

    MODULES.forEach(function (m) {
      var panel = panels[m.id];
      m.inputs.forEach(function (inp) {
        var input = panel.querySelector('input[data-key="' + inp.key + '"]');
        input.value = String(state.values[m.id][inp.key]);
      });
      update(m, false);
    });

    renderReport();
    setTheme(state.theme);
    activate(state.active);
    document.getElementById("year").textContent = new Date().getFullYear();
  }

  init();
})();
</script>
</body>
